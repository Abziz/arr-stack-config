---
# Values in ${VAR:-default} come from the .env file; the default after ":-" is used when unset.
services:
  # image used to index torrent links from the internet
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: arr-suite-prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./configs}/prowlarr:/config # location of database and configs
    ports:
      - ${PROWLARR_PORT:-9696}:9696 # web ui
    restart: unless-stopped

  # image used to scan for tv shows
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: arr-suite-sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./configs}/sonarr:/config # location of database and configs
      - ${MEDIA_ROOT:-./media}:/media # location of media library + qbittorrent download folder
    ports:
      - ${SONARR_PORT:-8989}:8989 # web ui
    restart: unless-stopped

  # image used to scan for movies
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: arr-suite-radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./configs}/radarr:/config # location of database and configs
      - ${MEDIA_ROOT:-./media}:/media # location of media library + qbittorrent download folder
    ports:
      - ${RADARR_PORT:-7878}:7878 # web ui
    restart: unless-stopped

  # image used to manage subtitles
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: arr-suite-bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./configs}/bazarr:/config # location of database and configs
      - ${MEDIA_ROOT:-./media}:/media # location of media library
    ports:
      - ${BAZARR_PORT:-6767}:6767 # web ui
    restart: unless-stopped

  # image used to bypass cloudflare for prowlarr
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: arr-suite-flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ:-Etc/UTC}
    ports:
      - ${FLARESOLVERR_PORT:-8191}:8191 # api used by prowlarr
    restart: unless-stopped

  # image used to download stuff
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: arr-suite-qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT:-./configs}/qbittorrent:/config # location of database and configs
      - ${MEDIA_ROOT:-./media}/downloads:/media/downloads # location of qbittorrent downloads
    ports:
      - ${QBITTORRENT_PORT:-8080}:8080 # web ui
      - ${QBITTORRENT_TORRENT_PORT:-6881}:6881 # torrent traffic
      - ${QBITTORRENT_TORRENT_PORT:-6881}:6881/udp
    restart: unless-stopped

  # image used to manage media and stream it
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: arr-suite-jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./configs}/jellyfin:/config # location of database and configs; can grow very large
      - ${MEDIA_ROOT:-./media}:/data # location of media library
    ports:
      - ${JELLYFIN_PORT:-8096}:8096 # web ui
    restart: unless-stopped
